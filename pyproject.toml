[project]
name = "monte-carlo"
version = "0.1.0"
description = "蒙特卡洛模拟与可视化：GBM 路径、期权定价、收敛性与方差缩减"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dachuan" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
monte-carlo = "monte_carlo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monte_carlo"]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
